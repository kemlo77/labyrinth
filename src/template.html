<!DOCTYPE html>
<meta charset="UTF-8">
<html lang="en" xml:lang="en">

<head>
    <title>Generate a labyrinth</title>
    <meta name="title" content="Maze generator">
    <meta name="description" content="A tool that generates a hexagonal, triangular or square maze.">
    <meta name="keywords"
        content="honeycomb, hexagonal, square, triangular, maze, labyrinth, generate, generator, html5, canvas, typescript">
    <meta name="robots" content="index, follow">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="language" content="English">
</head>

<body>
    <br>
    Select type of grid:<br>
    <form>
        <input type="radio" id="triangular" name="mazeType" value="triangular">
        <label for="triangular">Triangular</label><br>
        <input type="radio" id="square" name="mazeType" value="square">
        <label for="square">Square</label><br>
        <input type="radio" id="hexagonal" name="mazeType" value="hexagonal">
        <label for="hexagonal">Hexagonal</label><br>
        <input type="radio" id="rhomboid" name="mazeType" value="rhomboid">
        <label for="rhomboid">Rhomboid</label><br><br>

        <input type="radio" id="standard" name="mazeType" value="standard" checked>
        <label for="standard">Standard</label><br>
        <input type="radio" id="runningBond" name="mazeType" value="runningBond">
        <label for="runningBond">Running bond</label><br>
        <input type="radio" id="hexagons" name="mazeType" value="hexagons">
        <label for="hexagons">Hexagons</label><br>
        <input type="radio" id="triangles" name="mazeType" value="triangles">
        <label for="triangles">Triangles</label><br>
        <input type="radio" id="octagons" name="mazeType" value="octagons">
        <label for="octagons">Octagons</label><br>
        <input type="radio" id="diagonalSquares" name="mazeType" value="diagonalSquares">
        <label for="diagonalSquares">Diagonal squares</label><br><br>

        <input type="radio" id="swedishFlag" name="mazeType" value="swedishFlag">
        <label for="swedishFlag">Swedish flag</label><br>
        <input type="radio" id="starGrid" name="mazeType" value="starGrid">
        <label for="starGrid">Star</label><br>
        <input type="radio" id="sierpinskiTriangle" name="mazeType" value="sierpinskiTriangle">
        <label for="sierpinskiTriangle">Sierpinski triangle</label><br>
    </form>
    <br>
    <button type="button" id="generateButton">Generate labyrinth</button>
    <br>
    <canvas id="myCanvas" width="1050" height="660"></canvas><br>
    <button type="button" id="simplifyButton">Make simpler</button> tap tap tap ...<br>
    <button type="button" id="showTrailButton">Show solution</button>
    <button type="button" id="hideTrailButton">Hide solution</button><br><br>
    Check out source code at <a href="https://github.com/kemlo77/labyrinth">github</a>.


</body>

</html>
